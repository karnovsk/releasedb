services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: releasedb
      POSTGRES_PASSWORD: releasedb
      POSTGRES_DB: releasedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releasedb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

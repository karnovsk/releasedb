# Alembic configuration for ReleaseDB
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts, relative to this file
script_location = %(here)s

# Template for new migration filenames
file_template = %%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = UTC

# Max length for the slug portion of the filename
truncate_slug_length = 40

# Version table name in the database
version_table = alembic_version

# Connection string — override with DATABASE_URL env var (see env.py)
# Format: postgresql+psycopg2://user:password@host:5432/dbname
sqlalchemy.url = postgresql+psycopg2://localhost/releasedb


[post_write_hooks]
# Optionally run black / ruff on generated files:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "releasedb"
version = "2.0.0"
description = "Python SDK for the ReleaseDB release management system"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "responses>=0.23",   # mock HTTP in tests
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
]

[project.scripts]
# Run a validator script with dry-run support for local testing
releasedb-validate = "releasedb.validator.cli:main"
# Sync a releasedb.yaml config file to the ReleaseDB API
releasedb-sync     = "releasedb.sync.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["releasedb*"]
